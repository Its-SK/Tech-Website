    <!-- FIX: Removed the blue background style from the nav -->

        </div>

    <!-- App Gallery Section -->
    <section class="section-padding" style="padding-top: 120px; min-height: 70vh;">

            </h3>
            <div id="android-apps-grid" style="display: flex; justify-content: flex-start; gap: 20px; flex-wrap: wrap; margin-top: 30px;">
