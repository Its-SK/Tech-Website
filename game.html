<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASA Solutions | Multiplayer Draw & Guess</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- PASTE YOUR SASA SOLUTIONS NAVBAR HERE -->

    <section class="section-padding" style="background: var(--bg-light); min-height: 80vh;">
        <div class="container">
            <h2 class="section-title">Draw & Guess Showcase</h2>
            <p class="section-subtitle">A live multiplayer demo built by SASA Solutions.</p>
            
            <!-- Room Selection Lobby -->
            <div id="lobbyContainer" style="background: var(--white); padding: 40px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); max-width: 500px; margin: 0 auto; text-align: center;">
                <h3 style="color: var(--primary-color); margin-bottom: 20px;">Welcome to SASA Draw!</h3>
                
                <input type="text" id="playerNameInput" placeholder="Enter Your Name" class="form-input" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;" required>
                
                <!-- Rounds Selector for Creating a Room -->
                <div style="margin-bottom: 20px; text-align: left;">
                    <label style="font-weight: bold; font-size: 0.9rem; color: var(--text-light);">Number of Rounds (Create Only):</label>
                    <select id="roundsInput" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-top: 5px;">
                        <option value="1">1 Round</option>
                        <option value="2">2 Rounds</option>
                        <option value="3" selected>3 Rounds</option>
                        <option value="5">5 Rounds</option>
                    </select>
                </div>
                
                <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;">
                    <button id="showCreateBtn" class="btn-primary" style="flex: 1;">Create Room</button>
                    <button id="showJoinBtn" class="btn-primary" style="flex: 1; background: #28a745;">Join Room</button>
                </div>

                <!-- Hidden Join Room Details -->
                <div id="joinRoomDetails" style="display: none; margin-top: 15px;">
                    <input type="text" id="roomIdInput" placeholder="Enter 4-Letter Room ID" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; text-transform: uppercase;" maxlength="4">
                    <button id="joinSubmitBtn" class="btn-primary" style="width: 100%; background: #28a745;">Join Game Now</button>
                    <p id="joinError" style="color: red; margin-top: 10px; display: none;"></p>
                </div>
            </div>

            <!-- MAIN GAME -->
            <div id="mainGameContainer" class="game-container" style="display: none;">
                
                <!-- Header with Room ID and Timer -->
                <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 10px;">
                    <h3 style="color: var(--text-light); font-size: 1.2rem;">Room: <span id="displayRoomId" style="color: var(--primary-color); letter-spacing: 2px;"></span></h3>
                    <h3 style="color: #d9534f; font-size: 1.2rem;">Time: <span id="timerDisplay">--</span>s</h3>
                </div>

                <!-- Live Scoreboard -->
                <div id="scoreboard" style="width: 100%; display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap;">
                    <!-- Player scores will be injected here automatically -->
                </div>

                <div id="wordSelectionArea" style="width: 100%; text-align: center; margin-bottom: 15px;">
                    <button id="startGameBtn" class="btn-primary" style="width: 100%; max-width: 300px; background: #ff9800;">Start Game Loop</button>
                    <div id="wordChoices" style="display: none; gap: 10px; justify-content: center; margin-top: 10px;"></div>
                    <h3 id="currentWordDisplay" style="color: var(--primary-color); display: none; margin-top: 10px;"></h3>
                </div>

                <div class="canvas-container">
                    <div class="toolbar">
                        <input type="color" id="colorPicker" value="#0b3d91">
                        <input type="range" id="brushSize" min="1" max="20" value="5">
                        <button id="clearBtn" class="btn-primary" style="padding: 5px 15px;">Clear Canvas</button>
                    </div>
                    <canvas id="gameCanvas" width="800" height="500"></canvas>
                </div>

                <div class="chat-container">
                    <ul id="messages"></ul>
                    <form id="chatForm">
                        <input id="chatInput" autocomplete="off" placeholder="Guess the word..." required />
                        <button type="submit" class="btn-primary" style="border-radius: 0 4px 4px 0;">Send</button>
                    </form>
                </div>

                <!-- NEW: Game Over Modal -->
                <div id="gameOverModal">
                    <div class="modal-content">
                        <h2 style="color: var(--primary-color); margin-bottom: 10px;">🏆 Game Over!</h2>
                        <h3 id="winnerDisplay" style="color: #28a745; margin-bottom: 20px;"></h3>
                        <ul id="finalScoresList" style="list-style: none; padding: 0; margin-bottom: 20px; font-size: 1.1rem; line-height: 1.8;"></ul>
                        <button id="closeModalBtn" class="btn-primary" style="width: 100%;">Close & Play Again</button>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- PASTE YOUR SASA SOLUTIONS FOOTER HERE -->

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
